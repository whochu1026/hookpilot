# Full stack demo (API + Web + Postgres + Redis + Nginx)
# Usage: docker compose -f docker-compose.yml -f docker-compose.full.yml up --build

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hookpilot-api
    environment:
      DATABASE_URL: postgresql://hookpilot:hookpilot@postgres:5432/hookpilot?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost
      WEBHOOK_MAX_ATTEMPTS: 5
      WEBHOOK_TIMEOUT_MS: 10000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
    container_name: hookpilot-web
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: hookpilot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
