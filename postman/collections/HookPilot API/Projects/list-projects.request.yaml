$kind: http-request
name: List projects
order: 2000
method: GET
url: '{{base_url}}/projects'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Lists projects', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.be.an('array');
      });
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
