$kind: http-request
name: Health
order: 100
method: GET
url: '{{base_url}}/health'
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Health OK', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('ok');
      });
examples: ./.resources/health.resources/examples
