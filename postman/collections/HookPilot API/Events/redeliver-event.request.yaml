$kind: http-request
name: Redeliver event
order: 5000
method: POST
url: '{{base_url}}/projects/{{project_id}}/events/{{event_id}}/redeliver'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Redelivery queued', function () {
        pm.expect([200, 201]).to.include(pm.response.code);
      });
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
