$kind: http-request
name: Ingest event (idempotent replay)
order: 2000
method: POST
url: '{{base_url}}/v1/events'
headers:
  - key: Content-Type
    value: application/json
  - key: X-API-Key
    value: '{{api_key}}'
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "endpointId": "{{endpoint_id}}",
      "eventType": "order.created",
      "payload": {
        "orderId": "{{idempotency_key}}",
        "amount": 15000
      },
      "idempotencyKey": "{{idempotency_key}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Duplicate returns same event', function () {
        pm.expect([200, 201]).to.include(pm.response.code);
        const data = pm.response.json();
        pm.expect(data.duplicated).to.eql(true);
        pm.expect(data.event.id).to.eql(pm.environment.get('event_id'));
      });
