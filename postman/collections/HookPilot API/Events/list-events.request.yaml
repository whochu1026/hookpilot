$kind: http-request
name: List events
order: 4000
method: GET
url: '{{base_url}}/projects/{{project_id}}/events'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Lists events', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.be.an('array');
      });
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
